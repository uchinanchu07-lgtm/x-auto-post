name: Daily Sort Sheet

on:
  schedule:
    # 毎日 JST 07:15 (UTC 22:15 前日)
    - cron: '15 22 * * *'
    # 毎日 JST 19:15 (UTC 10:15)
    - cron: '15 10 * * *'
  workflow_dispatch:
    # 手動実行も可能

jobs:
  sort:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write Google service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p credentials
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > credentials/service-account.json

      - name: Create .env file
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_HANDLE: ${{ secrets.X_HANDLE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "SPREADSHEET_ID=$SPREADSHEET_ID" >> .env
          echo "X_API_KEY=$X_API_KEY" >> .env
          echo "X_API_KEY_SECRET=$X_API_KEY_SECRET" >> .env
          echo "X_ACCESS_TOKEN=$X_ACCESS_TOKEN" >> .env
          echo "X_ACCESS_TOKEN_SECRET=$X_ACCESS_TOKEN_SECRET" >> .env
          echo "X_HANDLE=$X_HANDLE" >> .env
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> .env

      - name: Sort spreadsheet
        run: node tools/sort-sheet.mjs
