name: Keepalive

# GitHub は「60日間リポジトリに活動(push)がない」と
# スケジュール実行のワークフロー(auto-post.yml 等)を自動的に無効化する。
# スケジュール実行そのものは「活動」とみなされないため、
# 定期的に空コミットを push してリポジトリを活動状態に保つ。

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - name: Update keepalive timestamp
        run: |
          mkdir -p .github
          echo "Last keepalive run: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/KEEPALIVE.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/KEEPALIVE.md
          git commit -m "chore: keepalive (${{ github.run_id }})" || echo "No changes to commit"
          git push
