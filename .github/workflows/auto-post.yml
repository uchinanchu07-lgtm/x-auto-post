name: X Auto Post Scheduler

on:
  schedule:
    # 5分ごとにチェック（GitHub Actions の最小間隔）
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # 手動でも実行できるようにする（テスト用）

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write Google OAuth tokens
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_TOKENS_JSON }}' > credentials/tokens.json

      - name: Run scheduler (once)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_HANDLE: ${{ secrets.X_HANDLE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tools/schedule.mjs --once
