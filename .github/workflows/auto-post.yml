name: X Auto Post Scheduler

on:
  repository_dispatch:
    types: [post-scheduled]  # cron-job.org から叩かれたら起動
  schedule:
    - cron: '0 22 * * *'   # 毎日 07:00 JST（UTC+9 → UTC 22:00 前日）fallback
    - cron: '0 10 * * *'   # 毎日 19:00 JST（UTC+9 → UTC 10:00）fallback
  workflow_dispatch:
    # 手動でも実行できるようにする（テスト用）

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write Google service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p credentials
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > credentials/service-account.json

      - name: Create .env file
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_HANDLE: ${{ secrets.X_HANDLE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_HANDLE: ${{ secrets.THREADS_HANDLE }}
        run: |
          echo "SPREADSHEET_ID=$SPREADSHEET_ID" >> .env
          echo "X_API_KEY=$X_API_KEY" >> .env
          echo "X_API_KEY_SECRET=$X_API_KEY_SECRET" >> .env
          echo "X_ACCESS_TOKEN=$X_ACCESS_TOKEN" >> .env
          echo "X_ACCESS_TOKEN_SECRET=$X_ACCESS_TOKEN_SECRET" >> .env
          echo "X_HANDLE=$X_HANDLE" >> .env
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> .env
          echo "THREADS_ACCESS_TOKEN=$THREADS_ACCESS_TOKEN" >> .env
          echo "THREADS_USER_ID=$THREADS_USER_ID" >> .env
          echo "THREADS_HANDLE=$THREADS_HANDLE" >> .env

      - name: Run scheduler (once)
        run: node tools/schedule.mjs --once
